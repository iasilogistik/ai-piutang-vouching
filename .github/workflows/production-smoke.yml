name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production base URL
        required: false
        default: https://ai-piutang-vouching.vercel.app

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run production smoke checks
        env:
          PRODUCTION_BASE_URL: ${{ inputs.base_url }}
        run: python scripts/production_smoke.py
